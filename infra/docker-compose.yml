version: "3.9"
services:
  db:
    image: postgres:15-alpine
    container_name: ticketing-db
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticketpwd
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data: