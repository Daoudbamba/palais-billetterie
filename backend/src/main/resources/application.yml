spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketing}
    username: ${DB_USERNAME:ticket}
    password: ${DB_PASSWORD:ticketpwd}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  main:
    banner-mode: off

server:
  port: 8080

app:
  stripe:
    secret: ${STRIPE_SECRET:sk_test_replace}